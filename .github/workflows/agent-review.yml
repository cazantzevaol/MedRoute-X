name: MedRoute offline agent review
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Approx. morning European time; GitHub Actions scheduled runs may be delayed.
    - cron: '17 7 * * *'

permissions:
  contents: read

jobs:
  offline-agent-review:
    # Scheduled runs stop after the hackathon submission date.
    if: github.event_name != 'schedule' || github.event.repository.default_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Run automated specialist checks
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "$(date -u +%Y%m%d)" -gt "20261110" ]]; then
            echo 'Daily hackathon cycle ended after November 10, 2026.'
          else
            python scripts/agent_review.py --cases 30
          fi
      - name: Verify local submission artifacts (no upload or legal approval)
        run: python scripts/submission_gate.py --version 0.10
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medroute-agent-review
          path: reports/agent_automation/
          if-no-files-found: warn
          retention-days: 14
